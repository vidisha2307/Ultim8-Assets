
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ULTIM8 | Brand Guidelines</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">

      <a href="index.html"
         class="header-logo"
         aria-label="ULTIM8 homepage">
        <img src="black%20logo.png"
             alt="ULTIM8"
             class="header-logo-image">
      </a>

      <button class="menu-button"
              id="menuButton"
              type="button"
              aria-label="Open navigation"
              aria-expanded="false"
              aria-controls="navigationPanel">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>

  <!-- HAMBURGER NAVIGATION -->
  <nav class="navigation-panel"
       id="navigationPanel"
       aria-label="Brand guidelines navigation">
    <div class="navigation-grid"
         id="menuNavigation">
    </div>
  </nav>

  <!-- GUIDELINES CONTENT -->
  <main class="guidelines-main">
    <div class="grid-shell">

      <div class="grid-guides" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="guidelines-content">

        <h1 class="guidelines-page-title">
          OUR BRAND<br>
          GUIDELINES
        </h1>

        <!-- Generated by script.js -->
        <div id="guidelinesContainer"></div>

      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="grid-shell footer-grid">

      <div class="grid-guides" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="footer-brand">
        <a href="index.html">
          <img src="black%20logo.png"
               alt="ULTIM8"
               class="footer-logo">
        </a>

        <a href="#"
           class="footer-download"
           id="downloadLink">
          Download our assets
        </a>
      </div>

      <div class="footer-navigation"
           id="footerNavigation">
      </div>

    </div>
  </footer>

</body>
</html>
